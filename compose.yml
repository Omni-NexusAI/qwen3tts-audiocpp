# One self-contained audio.cpp candidate. It never manages Faster or Groxaxo.
services:
  qwen3tts-audiocpp:
    container_name: qwen3tts-audiocpp
    image: omni-nexusai/qwen3tts-audiocpp:cuda-bf16
    build:
      context: .
      dockerfile: integrations/audio-cpp/Dockerfile
    environment:
      AUDIOCPP_BACKEND: cuda
      AUDIO_CPP_TTS_BASE_URL: http://127.0.0.1:8080/v1
      AUDIO_CPP_CONTROL_URL: http://127.0.0.1:8080/control
      AUDIO_CPP_ACTIVE_MODEL: qwen3-tts-1.7b-base-bf16
      AUDIO_CPP_TTS_MODELS: qwen3-tts-0.6b-base-bf16,qwen3-tts-1.7b-base-bf16
      VOICE_LIBRARY_DIR: /voices
    ports:
      - "127.0.0.1:${AUDIO_CPP_API_PORT:-8890}:8080"
      - "127.0.0.1:${AUDIO_CPP_STUDIO_PORT:-8891}:7860"
    volumes:
      - qwen3tts-audiocpp-voice-library:/voices
    restart: "no"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  qwen3tts-audiocpp-voice-library:
